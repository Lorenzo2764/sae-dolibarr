services:
  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: $DB_ROOT_PASSWORD
      MARIADB_DATABASE: $DB_NAME
      MARIADB_USER: $DB_USER
      MARIADB_PASSWORD: $DB_PASSWORD
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql

  dolibarr:
    image: dolibarr/dolibarr:latest
    restart: unless-stopped
    ports:
      - "$DOLIBARR_PORT:80"
    environment:
      DOLI_DB_TYPE: mysqli
      DOLI_DB_HOST: db
      DOLI_DB_HOST_PORT: 3306
      DOLI_DB_NAME: $DB_NAME
      DOLI_DB_USER: $DB_USER
      DOLI_DB_PASSWORD: $DB_PASSWORD
      DOLI_ADMIN_LOGIN: $DOLI_ADMIN_NAME
      DOLI_ADMIN_PASSWORD: $DOLI_ADMIN_PASSWORD
      DOLI_URL_ROOT: http://localhost:$DOLIBARR_PORT
      DOLI_INSTALL_AUTO: 1
      DOLI_COMPANY_NAME: "SAE51DOLI"
      DOLI_INIT_DEMO: 0
      DOLI_COMPANY_COUNTRYCODE: FR
      DOLI_ENABLE_MODULES: Societe,Import,Export,Fournisseur
      PHP_INI_DATE_TIMEZONE: Europe/Paris
    volumes:
      - documents:/var/www/documents

volumes:
  db_data:
  documents: